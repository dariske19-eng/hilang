<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Halaman Tidak Dijumpai | Drizz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#071B12;
    --dark:#0C3722;
    --mid:#1C7A46;
    --light:#9CFA4C;
    --pale:#EFFFE2;
    --white:#FFFFFF;
    --text-soft:#2F5240;
    --radius-blob: 62% 38% 55% 45% / 45% 55% 45% 55%;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--ink);
    color:var(--white);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px 24px;
    overflow:hidden;
    position:relative;
  }
  a{ color:inherit; text-decoration:none; }

  .blob{
    position:absolute;
    border-radius: var(--radius-blob);
    animation: morph 9s ease-in-out infinite alternate;
    z-index:0;
  }
  @keyframes morph{
    0%{ border-radius: 62% 38% 55% 45% / 45% 55% 45% 55%; }
    50%{ border-radius: 45% 55% 40% 60% / 60% 40% 60% 40%; }
    100%{ border-radius: 55% 45% 65% 35% / 40% 60% 35% 65%; }
  }
  .blob-1{ width:560px; height:560px; background: var(--mid); top:-200px; right:-160px; opacity:.45; }
  .blob-2{ width:320px; height:320px; background: var(--light); bottom:-140px; left:-100px; opacity:.16; animation-duration: 11s; }
  @media (prefers-reduced-motion: reduce){ .blob{ animation:none; } }

  .content{ position:relative; z-index:2; max-width:520px; }

  .brand{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-bottom:52px;
  }
  .brand img{ width:38px; height:38px; border-radius:12px; }
  .brand span{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:700;
    font-size:1.25rem;
  }

  .code-wrap{
    position:relative;
    display:inline-block;
    margin-bottom:8px;
  }
  .code{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:700;
    font-size: clamp(5rem, 20vw, 8.5rem);
    line-height:1;
    background: linear-gradient(150deg, var(--light), var(--mid));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: float 3.4s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-10px); }
  }
  @media (prefers-reduced-motion: reduce){ .code{ animation:none; } }

  .drip{
    position:absolute;
    width:12px; height:22px;
    background:var(--light);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity:.7;
    animation: drip-fall 2.6s ease-in infinite;
  }
  .drip-1{ top:6%; left:6%; animation-delay:.2s; }
  .drip-2{ top:14%; right:10%; animation-delay:1.1s; width:9px; height:16px; }
  .drip-3{ bottom:2%; left:40%; animation-delay:1.8s; width:8px; height:14px; }
  @keyframes drip-fall{
    0%{ transform: translateY(-6px); opacity:0; }
    30%{ opacity:.7; }
    100%{ transform: translateY(16px); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .drip{ animation:none; opacity:.4; } }

  h1{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:600;
    font-size: clamp(1.5rem, 3.6vw, 2rem);
    margin-bottom:14px;
  }
  p{
    color: rgba(255,255,255,.65);
    font-size:1.02rem;
    max-width:42ch;
    margin: 0 auto 36px;
  }

  .btn-row{
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .btn-primary{
    background:var(--light); color:var(--ink);
    padding:15px 28px; border-radius:100px;
    font-weight:600; font-size:.98rem;
    display:inline-block;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .btn-primary:hover{ box-shadow: 0 12px 26px rgba(156,250,76,.3); transform:translateY(-2px); }
  .btn-ghost{
    border:1.5px solid rgba(255,255,255,.3); color:var(--white);
    padding:15px 28px; border-radius:100px; font-weight:600; font-size:.98rem;
    transition: border-color .2s ease, background .2s ease, transform .2s ease;
  }
  .btn-ghost:hover{ border-color:var(--white); background:rgba(255,255,255,.06); transform:translateY(-2px); }

  .path-note{
    margin-top:44px;
    font-size:.82rem;
    color: rgba(255,255,255,.4);
    font-family:'Inter', sans-serif;
  }
  .path-note span{ color: var(--light); }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="content">
    <a href="/" class="brand">
      <img src="https://i.ibb.co/PvtKBPC6/file-000000008afc81f5a4251cf2b3c49e32.png" alt="Logo Drizz">
      <span>Drizz</span>
    </a>

    <div class="code-wrap">
      <div class="drip drip-1"></div>
      <div class="drip drip-2"></div>
      <div class="drip drip-3"></div>
      <div class="code">404</div>
    </div>

    <h1>Laman ini tak dijumpai</h1>
    <p>Pautan yang anda ikuti mungkin dah berpindah atau tak wujud lagi. Jom balik ke laman utama.</p>

    <div class="btn-row">
      <a href="/" class="btn-primary">Kembali ke Laman Utama</a>
      <a href="/#hubungi" class="btn-ghost">Hubungi Saya</a>
    </div>

    <p class="path-note">Ralat <span>404 · Not Found</span></p>
  </div>

</body>
</html>
